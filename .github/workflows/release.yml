name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tauri-args: --bundles nsis --config src-tauri/tauri.signing.conf.json
          - os: macos-latest
            tauri-args: --bundles app,dmg --target universal-apple-darwin
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # No rust-cache here. A cache saved on refs/tags/vX is readable by that
      # tag alone, so a release restored nothing and still paid a minute to
      # save. Measured on v0.17.0: 2s restore (miss), 1m save.

      - name: Install frontend dependencies
        run: npm ci

      # The prebuilt binary, not `cargo install`, which compiled it from
      # source on every release: 3m44s on v0.17.0. ~/.cargo/bin is already on
      # PATH, and the signCommand below invokes the tool by bare name.
      #
      # Pinned to 0.10.0, the last release under this name: upstream renamed
      # the crate to artifact-signing-cli at 0.11.0, following Azure's rename
      # of the service. The crates.io name we install today is frozen at
      # 0.10.0, so it takes no more updates -- moving to the new name is a
      # deliberate step, and the flags have to be re-checked when we take it.
      - name: Install trusted-signing-cli
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o ~/.cargo/bin/trusted-signing-cli.exe             https://github.com/Levminer/trusted-signing-cli/releases/download/0.10.0/trusted-signing-cli.exe

      - name: Generate signing config
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          $config = @{
            bundle = @{
              windows = @{
                signCommand = "trusted-signing-cli --azure-client-id $env:AZURE_CLIENT_ID --azure-client-secret $env:AZURE_CLIENT_SECRET --azure-tenant-id $env:AZURE_TENANT_ID -e https://weu.codesigning.azure.net -a signing-sop-sorcery -c sop-recorder-profile -d sop-sorcery %1"
              }
            }
          }
          $config | ConvertTo-Json -Depth 4 | Out-File -FilePath src-tauri/tauri.signing.conf.json -Encoding utf8NoBOM

      - name: Import the macOS signing certificate
        if: runner.os == 'macOS'
        uses: ./.github/actions/import-macos-signing-cert
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # notarytool authenticates with an App Store Connect API key, which is
      # owned by the team rather than by a person, so it survives someone
      # leaving. The file has to exist on disk and be named for its key ID.
      - name: Provide the notarization API key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY_P8}" ]; then
            echo "No notarization key configured; the build is signed but not notarized."
            exit 0
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # A stable code identity across releases, so an update does not cost
          # every user their permissions. See docs/macos-signing.md.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization. APPLE_API_KEY_PATH is exported by the step above.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: "v__VERSION__"
          # Draft until both matrix legs have finished. Each leg uploads its
          # own assets, so a release published per-leg is visible -- and
          # reachable by the updater -- while the other platform is still
          # building, or after it has failed. A draft is excluded from
          # `releases/latest` exactly as a prerelease is, so the updater keeps
          # serving the last good version until the publish job flips it.
          releaseDraft: true
          # A semver prerelease tag carries a hyphen: v0.19.0-rc.1. GitHub
          # keeps prereleases out of `releases/latest`, which is the stable
          # updater endpoint, so a tester's build can never reach a user who
          # did not opt in.
          prerelease: ${{ contains(github.ref_name, '-') }}
          updaterJsonPreferNsis: true
          args: ${{ matrix.tauri-args }}

      # Tauri notarizes and staples the .app, then builds the DMG around it and
      # only *signs* that -- so a downloaded disk image is rejected outright
      # ("source=Unnotarized Developer ID"), which is the very first thing a new
      # user double-clicks. Verified on the 0.17.0 test build. Notarize and
      # staple the image too, then replace the asset on the release.
      - name: Notarize and staple the DMG
        if: runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY_PATH:-}" ]; then
            echo "Build was not notarized; nothing to staple."
            exit 0
          fi
          DMG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          gh release upload "$GITHUB_REF_NAME" "$DMG" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Deploy installer to server
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          EXE_FILE=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            "$EXE_FILE" \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/

  # Both platforms are done and uploaded. Make the release visible, then move
  # the beta channel onto it.
  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" --draft=false             --repo "$GITHUB_REPOSITORY"

      # The beta channel is one rolling release whose latest.json is replaced
      # on every tag, stable ones included. Carrying only prereleases would
      # strand a tester who took 0.19.0-rc.1: 0.19.0 sorts higher under semver,
      # so the stable build that follows has to appear on this channel too or
      # the tester is never offered anything again.
      #
      # Published after the release above, so a failure here costs beta users a
      # delay and stable users nothing.
      - name: Point the beta channel at this build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --pattern latest.json             --dir . --clobber --repo "$GITHUB_REPOSITORY"
          # --prerelease is load-bearing, not cosmetic: it keeps this release
          # out of `releases/latest`, which is the stable updater endpoint.
          # Without it the beta channel would eventually become what every
          # stable user downloads.
          gh release view beta --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||             gh release create beta --prerelease --title "Beta channel"               --notes "Rolling pointer for the in-app beta channel. The latest.json here names the newest build, stable or prerelease. Not a download: install from a versioned release."               --repo "$GITHUB_REPOSITORY"
          gh release upload beta latest.json --clobber             --repo "$GITHUB_REPOSITORY"

  notify:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Notify Slack
        shell: bash
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"New Recorder release: ${{ github.ref_name }}\",\"blocks\":[{\"type\":\"section\",\"text\":{\"type\":\"mrkdwn\",\"text\":\"*New Recorder Release: ${{ github.ref_name }}*\nChangelog: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md\"}}]}"
