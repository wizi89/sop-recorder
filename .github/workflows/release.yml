name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tauri-args: --bundles nsis --config src-tauri/tauri.signing.conf.json
          - os: macos-latest
            tauri-args: --bundles app,dmg --target universal-apple-darwin
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Install trusted-signing-cli
        if: runner.os == 'Windows'
        run: cargo install trusted-signing-cli

      - name: Generate signing config
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          $config = @{
            bundle = @{
              windows = @{
                signCommand = "trusted-signing-cli --azure-client-id $env:AZURE_CLIENT_ID --azure-client-secret $env:AZURE_CLIENT_SECRET --azure-tenant-id $env:AZURE_TENANT_ID -e https://weu.codesigning.azure.net -a signing-sop-sorcery -c sop-recorder-profile -d sop-sorcery %1"
              }
            }
          }
          $config | ConvertTo-Json -Depth 4 | Out-File -FilePath src-tauri/tauri.signing.conf.json -Encoding utf8NoBOM

      # Tauri can import a .p12 itself, but doing the keychain work here keeps
      # the search list under our control, which is what actually decides
      # whether the identity resolves. `security find-identity -v` means
      # *valid*, and validity is a chain evaluation: the Developer ID leaf has
      # to reach Apple's root through a keychain that is in the search list.
      # Import alone therefore reports "1 identity imported" and the build
      # still fails with "failed to resolve signing identity".
      - name: Import the macOS signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE}" ]; then
            echo "No signing certificate configured; the build stays ad-hoc."
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -A -T /usr/bin/codesign
          # Without this codesign blocks on a UI prompt for the private key.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # login.keychain-db stays in the list: replacing it outright breaks
          # unrelated lookups later in the build. The Developer ID chain needs
          # nothing beyond this -- the G2 intermediate travels inside the .p12
          # and Apple's root is already trusted on the runner. No
          # add-trusted-cert: that was only ever needed to make a self-signed
          # certificate count as valid, and forcing trust on a real Developer
          # ID would hide a genuinely broken chain until users hit it.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          rm -f "$RUNNER_TEMP/cert.p12"
          echo "Identities now resolvable:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # notarytool authenticates with an App Store Connect API key, which is
      # owned by the team rather than by a person, so it survives someone
      # leaving. The file has to exist on disk and be named for its key ID.
      - name: Provide the notarization API key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY_P8}" ]; then
            echo "No notarization key configured; the build is signed but not notarized."
            exit 0
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # A stable code identity across releases, so an update does not cost
          # every user their permissions. See docs/macos-signing.md.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization. APPLE_API_KEY_PATH is exported by the step above.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: "v__VERSION__"
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.tauri-args }}

      # Tauri notarizes and staples the .app, then builds the DMG around it and
      # only *signs* that -- so a downloaded disk image is rejected outright
      # ("source=Unnotarized Developer ID"), which is the very first thing a new
      # user double-clicks. Verified on the 0.17.0 test build. Notarize and
      # staple the image too, then replace the asset on the release.
      - name: Notarize and staple the DMG
        if: runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY_PATH:-}" ]; then
            echo "Build was not notarized; nothing to staple."
            exit 0
          fi
          DMG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          gh release upload "$GITHUB_REF_NAME" "$DMG" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Deploy installer to server
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          EXE_FILE=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            "$EXE_FILE" \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/

  notify:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Notify Slack
        shell: bash
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"New Recorder release: ${{ github.ref_name }}\",\"blocks\":[{\"type\":\"section\",\"text\":{\"type\":\"mrkdwn\",\"text\":\"*New Recorder Release: ${{ github.ref_name }}*\nChangelog: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md\"}}]}"
