name: CI

on:
  workflow_dispatch:
    inputs:
      build_installers:
        description: "Also build the Windows and macOS installers"
        type: boolean
        default: true
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Both platforms, because the defects that only appear on macOS are the ones
  # this project keeps shipping: the two coordinate spaces that coincide on
  # Windows, the Keychain that has no Windows analogue, the input hook that
  # needs a permission there and not here. Windows-only tests could not have
  # caught any of them.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      # Gated, not advisory: the lints were clean once and had drifted back to
      # a dozen by the time anyone looked, because nothing failed a build over
      # them.
      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: TypeScript check
        run: npx tsc --noEmit

  # The real app, driven through its window: the journeys unit tests passed
  # over and only a windowed run found (a wait screen that never rendered, an
  # old server sending users into a five-minute wait). Windows only, because
  # that is where the WebView opens a DevTools port to drive it through.
  e2e:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Install the browser that plays the user's
        run: npx playwright install chromium

      - name: Build the app
        run: npm run e2e:build

      # WebView2 on the runner ignores WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS
      # (measured: the browser process starts without the flag, and no
      # policy is set), so the DevTools port goes in through its registry
      # policy instead. The port must match DEVTOOLS_PORT in e2e/app.ts.
      - name: Open the WebView's DevTools port
        run: reg add "HKLM\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments" /v cogniclone-recorder.exe /d "--remote-debugging-port=9333" /f

      - name: End-to-end tests
        run: npm run e2e

      # What the app was showing when a journey failed: Playwright writes the
      # window's accessibility snapshot next to each failure.
      - name: Upload the failure snapshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  # Tests run on every push; the installers do not. A macOS bundle takes about
  # ten minutes, which is a long time to wait on a branch where most commits
  # cannot affect packaging at all.
  #
  # Installers are built when the result is actually wanted: on main, on a
  # manual run, or on any commit whose message says so with [build]. Release
  # tags go through release.yml, which is untouched by this.
  build:
    needs: test
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_installers) ||
      contains(github.event.head_commit.message, '[build]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: windows-installer
            artifact-path: src-tauri/target/release/bundle/nsis/*.exe
            build-command: npx tauri build --bundles nsis
          - os: macos-latest
            artifact-name: macos-installer
            artifact-path: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            build-command: npx tauri build --bundles app,dmg --target universal-apple-darwin
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Import the macOS signing certificate
        if: runner.os == 'macOS'
        uses: ./.github/actions/import-macos-signing-cert
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build Tauri app
        run: ${{ matrix.build-command }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Signs macOS builds with the Developer ID instead of ad-hoc.
          # Without a certificate the app's code identity is its binary hash,
          # so every update looks like a different program: users re-grant
          # Screen Recording, Accessibility and the microphone each time, and
          # are asked for their Keychain password again. See
          # docs/macos-signing.md. Notarization happens in release.yml only.
          #
          # Absent secrets leave this empty and the binary stays linker-signed
          # ad-hoc, so forks still build.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          retention-days: 7
