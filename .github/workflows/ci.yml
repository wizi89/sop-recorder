name: CI

on:
  workflow_dispatch:
    inputs:
      build_installers:
        description: "Also build the Windows and macOS installers"
        type: boolean
        default: true
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Both platforms, because the defects that only appear on macOS are the ones
  # this project keeps shipping: the two coordinate spaces that coincide on
  # Windows, the Keychain that has no Windows analogue, the input hook that
  # needs a permission there and not here. Windows-only tests could not have
  # caught any of them.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: TypeScript check
        run: npx tsc --noEmit

  # Tests run on every push; the installers do not. A macOS bundle takes about
  # ten minutes, which is a long time to wait on a branch where most commits
  # cannot affect packaging at all.
  #
  # Installers are built when the result is actually wanted: on main, on a
  # manual run, or on any commit whose message says so with [build]. Release
  # tags go through release.yml, which is untouched by this.
  build:
    needs: test
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_installers) ||
      contains(github.event.head_commit.message, '[build]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: windows-installer
            artifact-path: src-tauri/target/release/bundle/nsis/*.exe
            build-command: npx tauri build --bundles nsis
          - os: macos-latest
            artifact-name: macos-installer
            artifact-path: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            build-command: npx tauri build --bundles app,dmg --target universal-apple-darwin
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Tauri can import a .p12 itself, but doing the keychain work here keeps
      # the search list under our control, which is what actually decides
      # whether the identity resolves. `security find-identity -v` means
      # *valid*, and validity is a chain evaluation: the Developer ID leaf has
      # to reach Apple's root through a keychain that is in the search list.
      # Import alone therefore reports "1 identity imported" and the build
      # still fails with "failed to resolve signing identity".
      - name: Import the macOS signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE}" ]; then
            echo "No signing certificate configured; the build stays ad-hoc."
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -A -T /usr/bin/codesign
          # Without this codesign blocks on a UI prompt for the private key.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # login.keychain-db stays in the list: replacing it outright breaks
          # unrelated lookups later in the build. The Developer ID chain needs
          # nothing beyond this -- the G2 intermediate travels inside the .p12
          # and Apple's root is already trusted on the runner. No
          # add-trusted-cert: `-r trustRoot` says "this is a root", which a
          # Developer ID leaf issued by Apple's CA is not, so the call fails
          # outright with SecTrustSettingsSetTrustSettings. It was only ever
          # there to make the self-signed stopgap count as valid.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          rm -f "$RUNNER_TEMP/cert.p12"
          echo "Identities now resolvable:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build Tauri app
        run: ${{ matrix.build-command }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Signs macOS builds with one stable certificate instead of ad-hoc.
          # Without a certificate the app's code identity is its binary hash,
          # so every update looks like a different program: users re-grant
          # Screen Recording, Accessibility and the microphone each time, and
          # are asked for their Keychain password again. See
          # scripts/macos-release-cert.sh.
          #
          # Absent secrets leave these empty and the build falls back to the
          # ad-hoc identity in tauri.conf.json, so forks still build.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          retention-days: 7
