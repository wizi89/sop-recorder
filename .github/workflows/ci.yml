name: CI

on:
  workflow_dispatch:
    inputs:
      build_installers:
        description: "Also build the Windows and macOS installers"
        type: boolean
        default: true
  push:
    branches: [main, "feature/**"]
  # A PR into any base, integration branches too: CI is the only hard gate.
  pull_request:

permissions:
  contents: read

jobs:
  # Markdown and docs/ feed no test or build step, so a change that touches
  # only those skips the heavy jobs below. Anything that cannot be decided
  # (a manual run, a new branch, a diff base missing from the clone) counts
  # as code: the cost of a wrong guess is a skipped test on real code.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether anything but docs changed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        # --no-renames lists both paths of a rename, so src/x.ts -> src/x.md
        # still counts as code. An empty diff (an empty "[build]" commit)
        # counts as code too.
        run: |
          code=true
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          if [ -n "$base" ] && ! [[ "$base" =~ ^0+$ ]] \
            && files=$(git diff --no-renames --name-only "$base"...HEAD); then
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -v -E '(\.md$|^docs/)' | grep -q .; then
              code=false
            fi
          fi
          echo "Changed files:"; printf '%s\n' "${files:-<empty or not computed>}"
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  # Both platforms, because the defects that only appear on macOS are the ones
  # this project keeps shipping: the two coordinate spaces that coincide on
  # Windows, the Keychain that has no Windows analogue, the input hook that
  # needs a permission there and not here. Windows-only tests could not have
  # caught any of them.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      # Gated, not advisory: the lints were clean once and had drifted back to
      # a dozen by the time anyone looked, because nothing failed a build over
      # them.
      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Frontend format
        run: npx biome ci .

      # The hook blocks on its planted violations and lets a clean stage
      # through; the last two lines of its output are the hook's own summary.
      - name: Pre-commit hook, proven on its fixtures
        shell: bash
        run: sh .githooks/selftest.sh

      # The One-way Door gate on stubbed PRs: red with an unticked box, green
      # without a door or with every box ticked.
      - name: One-way Door gate, proven on its fixtures
        shell: bash
        run: bash scripts/check_door_workflow.sh src-tauri/src/network/upload.rs

  # The real app, driven through its window: the journeys unit tests passed
  # over and only a windowed run found (a wait screen that never rendered, an
  # old server sending users into a five-minute wait). Windows only, because
  # that is where the WebView opens a DevTools port to drive it through.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target/e2e

      - name: Install frontend dependencies
        run: npm ci

      - name: Install the browser that plays the user's
        run: npx playwright install chromium

      - name: Build the app
        run: npm run e2e:build

      # WebView2 on the runner ignores WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS
      # (measured: the browser process starts without the flag, and no
      # policy is set), so the DevTools port goes in through its registry
      # policy instead. The port must match DEVTOOLS_PORT in e2e/app.ts.
      - name: Open the WebView's DevTools port
        run: reg add "HKLM\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments" /v cogniclone-recorder.exe /d "--remote-debugging-port=9333" /f

      - name: End-to-end tests
        run: npm run e2e

      # What the app was showing when a journey failed: Playwright writes the
      # window's accessibility snapshot next to each failure.
      - name: Upload the failure snapshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  # Tests run on every push; the installers do not. A macOS bundle takes about
  # ten minutes, which is a long time to wait on a branch where most commits
  # cannot affect packaging at all.
  #
  # Installers are built when the result is actually wanted: on main, on a
  # manual run, or on any commit whose message says so with [build]. Release
  # tags go through release.yml, which is untouched by this.
  build:
    needs: [changes, test]
    if: >-
      needs.changes.outputs.code == 'true' && (
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_installers) ||
      contains(github.event.head_commit.message, '[build]'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: windows-installer
            artifact-path: src-tauri/target/release/bundle/nsis/*.exe
            build-command: npx tauri build --bundles nsis
          - os: macos-latest
            artifact-name: macos-installer
            artifact-path: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            build-command: npx tauri build --bundles app,dmg --target universal-apple-darwin
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Import the macOS signing certificate
        if: runner.os == 'macOS'
        uses: ./.github/actions/import-macos-signing-cert
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build Tauri app
        run: ${{ matrix.build-command }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Signs macOS builds with the Developer ID instead of ad-hoc.
          # Without a certificate the app's code identity is its binary hash,
          # so every update looks like a different program: users re-grant
          # Screen Recording, Accessibility and the microphone each time, and
          # are asked for their Keychain password again. See
          # docs/macos-signing.md. Notarization happens in release.yml only.
          #
          # Absent secrets leave this empty and the binary stays linker-signed
          # ad-hoc, so forks still build.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          retention-days: 7

  # Runs on every change, docs included: an avoided term in a doc counts too.
  glossary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: The check still goes red on its bad fixture
        run: python3 -m unittest discover -s scripts -p "test_check_glossary_terms.py"

      - name: No new avoided GLOSSARY.md terms
        run: python3 scripts/check_glossary_terms.py

  # The custom Semgrep rules in .semgrep/ (today: no direct unlisten call).
  # Runs on every change, like glossary: it is cheap, and a skipped run proves
  # nothing. The script fails when the bad fixture stops going red, when the
  # good fixture goes red, or when src/ has a finding or no scanned file.
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Semgrep
        run: pipx install "semgrep==$(python3 scripts/check_semgrep.py --version)"

      - name: Custom rules, proven on their fixtures
        run: python3 scripts/check_semgrep.py

  # CI is the only hard gate, so every PR job has to block the merge when it
  # fails (FL-03e). The script reads the required checks from branch
  # protection and says what counts as covered; it runs on every change,
  # docs included, because a workflow change is what it guards.
  required-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Required checks, proven on their fixtures
        run: python3 -m unittest discover -s scripts -p "test_check_required_checks.py"

      - name: Required checks cover every PR job
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/branches/$DEFAULT_BRANCH"             --jq '.protection.required_status_checks.contexts[]' > "$RUNNER_TEMP/required.txt"
          python3 scripts/check_required_checks.py --required-file "$RUNNER_TEMP/required.txt"

  # The check branch protection requires, next to the One-way Door marker. A job skipped at job level
  # reports under its bare name, not per matrix leg, so requiring the legs
  # would leave a docs-only PR pending forever; this gate passes when every
  # job succeeded or was skipped, and fails on any failure or cancellation.
  ci:
    needs: [changes, glossary, semgrep, required-checks, test, e2e, build]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check the results of the other jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "A needed job ended with: $r"; exit 1 ;;
            esac
          done
